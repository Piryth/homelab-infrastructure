# roles/docker_apps/tasks/main.yml
---
# ── Caddy ────────────────────────────────────────────────────────────────────

- name: Create Caddy directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ caddy_base_dir }}"
    - "{{ caddy_base_dir }}/data"
    - "{{ caddy_base_dir }}/config"

- name: Template Caddyfile
  ansible.builtin.template:
    src: caddy/Caddyfile.j2
    dest: "{{ caddy_base_dir }}/Caddyfile"
    mode: "0644"
  register: caddyfile

- name: Template Dockerfile
  ansible.builtin.template:
    src: caddy/Dockerfile.j2
    dest: "{{ caddy_base_dir }}/Dockerfile"
    mode: "0644"
  register: dockerfile

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: caddy/docker-compose.yml.j2
    dest: "{{ caddy_base_dir }}/docker-compose.yml"
    mode: "0644"
  register: composefile

- name: Build and deploy Caddy stack
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_base_dir }}"
    build: "{{ (dockerfile is changed) | ternary('always', 'policy') }}"
    state: present
  register: caddy_deploy

- name: Reload Caddy if only Caddyfile changed
  when:
    - caddyfile is changed
    - dockerfile is not changed
    - composefile is not changed
  community.docker.docker_container_exec:
    container: caddy
    command: caddy reload --config /etc/caddy/Caddyfile

# ── Nextcloud ─────────────────────────────────────────────────────────────────

- name: Create Nextcloud directory structure
  ansible.builtin.file:
    path: "{{ nextcloud_base_dir }}"
    state: directory
    mode: "0750"

- name: Template Nextcloud docker-compose.yml
  ansible.builtin.template:
    src: nextcloud/docker-compose.yml.j2
    dest: "{{ nextcloud_base_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template Nextcloud .env
  ansible.builtin.template:
    src: nextcloud/.env.j2
    dest: "{{ nextcloud_base_dir }}/.env"
    mode: "0600"

- name: Deploy Nextcloud stack
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_base_dir }}"
    state: present

- name: Configure OnlyOffice internal document server URL
  community.docker.docker_container_exec:
    container: nextcloud-app
    user: www-data
    command: php occ config:app:set onlyoffice DocumentServerInternalUrl --value="http://onlyoffice-document-server/"

- name: Configure OnlyOffice storage URL (callback from OnlyOffice to Nextcloud)
  community.docker.docker_container_exec:
    container: nextcloud-app
    user: www-data
    command: php occ config:app:set onlyoffice StorageUrl --value="http://{{ nextcloud_domain }}/"

- name: Configure OnlyOffice JWT secret
  community.docker.docker_container_exec:
    container: nextcloud-app
    user: www-data
    command: php occ config:app:set onlyoffice secret --value="{{ onlyoffice_secret }}"

# LSS

- name: Create LSS directory structure
  ansible.builtin.file:
    path: "{{ lss_base_dir }}"
    state: directory
    mode: "0750"

- name: Template LSS docker-compose.yml
  ansible.builtin.template:
    src: lss/docker-compose.yml.j2
    dest: "{{ lss_base_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy LSS stack
  community.docker.docker_compose_v2:
    project_src: "{{ lss_base_dir }}"
    state: present
