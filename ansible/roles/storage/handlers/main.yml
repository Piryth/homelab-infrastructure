---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Requires= propagates the restart to mergerfs-pool, then to docker.service,
# so containers re-bind the fresh pool instead of keeping a stale mount.
- name: Restart rclone mount
  ansible.builtin.systemd:
    name: "{{ storage_rclone_unit }}"
    state: restarted

- name: Restart mergerfs-pool
  ansible.builtin.systemd:
    name: mergerfs-pool
    state: restarted
