server:
    ###########################################################################
    # LOGGING
    ###########################################################################
    verbosity: 0
    # logfile: "/var/log/unbound/unbound.log"
    # log-queries: no
    # log-replies: no

    # Local records for Homelab services
    local-zone: "endignous.fr." transparent

    # Proxmox (PVE)
    local-data: "pve.endignous.fr. IN A 192.168.1.220"
    local-data: "pve.home.lab. IN A 192.168.1.220"

    # Pi-hole
    local-data: "pihole.endignous.fr. IN A 192.168.1.222"
    local-data: "pi.home.lab. IN A 192.168.1.222"

    # Docker LXC (wildcard for all subdomains)
    local-data: "*.docker.endignous.fr. IN A 192.168.1.221"
    local-data: "docker.home.lab. IN A 192.168.1.221"

    # Caddy (reverse proxy)
    local-data: "caddy.endignous.fr. IN A 192.168.1.221"
    local-data: "proxy.home.lab. IN A 192.168.1.221"

    ###########################################################################
    # INTERFACES & PROTOCOL
    ###########################################################################
    interface: 127.0.0.1
    port: 5335

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    ###########################################################################
    # ROOT DNS - DIRECT RESOLUTION (No Forwarding)
    ###########################################################################
    # Download fresh root hints:
    # curl -o /var/lib/unbound/root.hints https://www.internic.net/domain/named.root
    root-hints: "/var/lib/unbound/root.hints"

    # Disable forwarding to ensure queries go directly to root DNS servers
    # Do NOT add any forward-zone entries below
    do-not-query-localhost: yes

    ###########################################################################
    # PERFORMANCE & THREADS
    ###########################################################################
    num-threads: 1

    # Slabs should be power of 2, close to num-threads
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2

    # Ensure kernel buffer is large enough to not lose messages in traffic spikes
    so-rcvbuf: 1m
    so-sndbuf: 1m

    ###########################################################################
    # CACHE SETTINGS
    ###########################################################################
    # Cache memory tuning (increase on machines with more RAM)
    rrset-cache-size: 256m
    msg-cache-size: 128m
    key-cache-size: 32m

    # Minimum/Maximum TTL for cache entries (seconds)
    cache-min-ttl: 300
    cache-max-ttl: 86400

    # Prefetch entries before they expire (for frequently queried domains)
    prefetch: yes
    prefetch-key: yes

    # Keep RRsets in cache for longer by serving stale data when needed
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30

    ###########################################################################
    # SECURITY & HARDENING
    ###########################################################################
    # Trust glue only if it is within the server's authority
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones
    harden-dnssec-stripped: yes

    # Reject very small EDNS buffer sizes from queries
    harden-large-queries: yes

    # Harden against out of zone rrsets
    harden-below-nxdomain: yes

    # Harden against algorithm downgrade
    harden-algo-downgrade: yes

    # Ignore very small EDNS buffer sizes
    harden-short-bufsize: yes

    # Do not use Capitalization randomization (known DNSSEC issues)
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size (DNS Flag Day 2020)
    edns-buffer-size: 1232

    # Randomize the order of returned A/AAAA records
    rrset-roundrobin: yes

    # Limit query retries to avoid flooding
    outbound-msg-retry: 5

    # TTL for negative cache entries (NXDOMAIN)
    cache-max-negative-ttl: 3600

    ###########################################################################
    # PRIVACY
    ###########################################################################
    # Ensure privacy of local IP ranges
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: 100.64.0.0/10       # Tailscale / CGN range
    private-address: fd00::/8
    private-address: fe80::/10

    # Hide server identity and version
    hide-identity: yes
    hide-version: yes
    identity: "DNS"

    # Refuse id.server and hostname.bind queries
    hide-trustanchor: yes

    # Minimal responses - do not include extra records
    minimal-responses: yes

    # Disable ANY queries
    deny-any: yes

    ###########################################################################
    # ACCESS CONTROL
    ###########################################################################
    # Default deny, allow only localhost and local networks
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.1/32 allow
    access-control: ::0/0 refuse
    access-control: ::1/128 allow

    ###########################################################################
    # RATE LIMITING
    ###########################################################################
    # Limit queries per second per IP to reduce abuse
    ratelimit: 1000
    ip-ratelimit: 500

    ###########################################################################
    # AUTO TRUST ANCHOR (DNSSEC)
    ###########################################################################
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    ###########################################################################
    # REMOTE CONTROL (optional - for unbound-control)
    ###########################################################################
    # remote-control:
    #   control-enable: yes
    #   control-interface: 127.0.0.1
    #   control-port: 8953